<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyBook</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MyBook">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* 색상 토큰: 라이트 기본, 시스템 다크 / 수동 전환 지원 */
:root{--bg:#fff;--text:#111;--sub:#6b6b6b;--card:#f4f4f5;--border:#e5e5e7;--accent:#111;--accent-text:#fff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--text:#ededed;--sub:#9a9a9f;--card:#1c1c1e;--border:#2c2c2e;--accent:#ededed;--accent-text:#000}}
:root[data-theme="dark"]{--bg:#000;--text:#ededed;--sub:#9a9a9f;--card:#1c1c1e;--border:#2c2c2e;--accent:#ededed;--accent-text:#000}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.view{display:none;height:100%;flex-direction:column;max-width:640px;margin:0 auto}
.view.active{display:flex}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px}
h1{font-size:32px;font-weight:800;margin:0}
.round{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-text);font-size:26px;line-height:1}
.list{flex:1;overflow-y:auto;padding:0 20px 100px}
.empty{text-align:center;color:var(--sub);margin-top:120px;line-height:1.6}
/* 책 카드 */
.card{display:flex;gap:14px;width:100%;text-align:left;background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px}
.cover{flex:none;width:64px;height:92px;border-radius:10px;color:#fff;font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center}
.info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.t{font-size:17px;font-weight:700}.a{font-size:14px;color:var(--sub);margin-top:2px}
.bar{height:5px;border-radius:3px;background:var(--border);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.pct{font-size:12px;color:var(--sub);margin-top:6px}
/* 책 추가 폼 */
.form{flex:1;overflow-y:auto;padding:0 20px 24px}
input,textarea{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--card);border:0;border-radius:14px;padding:14px;margin-bottom:12px}
textarea{height:220px;resize:none}
.btn{width:100%;padding:15px;border-radius:14px;font-weight:700;margin-top:4px}
.btn.main{background:var(--accent);color:var(--accent-text)}
.btn.sub{border:1px solid var(--border);margin-bottom:16px;font-weight:600}
.status{color:var(--sub);text-align:center;min-height:22px;margin:14px 0}
.cover{background-size:cover;background-position:center}
.card{position:relative;cursor:pointer}
.edit{position:absolute;top:8px;right:10px;padding:6px;font-size:16px;color:var(--sub)}
.t{padding-right:26px}
.prev{width:120px;height:172px;border-radius:14px;margin:4px auto 16px;color:#fff;font-size:44px;font-weight:700;display:flex;align-items:center;justify-content:center;background-size:cover;background-position:center}
.row{display:flex;gap:10px}.row .btn{margin-top:0}
.bar2{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 20px 8px;font-size:12px;color:var(--sub)}
.bar2 select{font:inherit;font-size:13px;color:var(--text);background:var(--card);border:0;border-radius:10px;padding:6px 8px}
.mv{position:absolute;right:6px;bottom:6px;display:flex}
.mv button{padding:6px 9px;font-size:15px;color:var(--sub)}
#tabs{display:none;position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs.on{display:flex}
#tabs button{flex:1;padding:12px 0 10px;font-size:14px;font-weight:600;color:var(--sub)}
#tabs button.on{color:var(--text)}
.minis{display:flex;flex:none;width:112px;align-items:center}
.mini{flex:none;width:44px;height:64px;margin-right:-22px;border-radius:6px;border:2px solid var(--card);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;background-size:cover;background-position:center}
.mini.none{background:var(--border)}
.pk input{width:22px;height:22px;margin:auto 0 auto 8px;flex:none}
.shbtns{padding:0 20px 16px;display:flex;flex-direction:column;gap:10px}
.shbtns .btn{margin:0}
/* 서재: 큰 표지를 옆으로 넘겨 보는 화면 */
.carousel{flex:1;min-height:0;position:relative;display:flex;align-items:flex-start;gap:36%;overflow-x:auto;scroll-snap-type:x mandatory;padding:20px 25% 110px;-webkit-overflow-scrolling:touch}
.slide{flex:0 0 100%;min-width:0;scroll-snap-align:center;cursor:pointer}
.bigcover{width:100%;aspect-ratio:2/3;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.25);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;text-align:center;padding:12px;font-size:20px;line-height:1.3;word-break:keep-all}
.srow{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-top:14px}
.stitle{font-size:18px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.edit2{flex:none;padding:2px 6px;font-size:22px;line-height:1;color:var(--sub)}
.sprog{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:13px}
.sprog .bar{flex:1;margin-top:0}
.mvrow{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px;color:var(--sub)}
.mvrow button{padding:6px 14px;font-size:16px;color:var(--text)}
.vt button{padding:4px 8px;font-size:22px;color:var(--sub);opacity:.45}
.vt button.on{opacity:1;color:var(--text)}
.back{font-size:16px;padding:6px 0}
/* 읽기 화면 */
.scroll{flex:1;min-height:0;overflow-y:auto;padding:28px 24px 64px}
.scroll h2{font-size:26px;font-weight:800;margin:0 0 24px}
#body{white-space:pre-wrap;line-height:1.7;letter-spacing:.2px;margin:0}
#body p{margin:0 0 1em}
#body.editing p{outline:1px dashed var(--border);border-radius:6px;padding:2px 4px;margin-left:-4px;margin-right:-4px;margin-bottom:1em}
.toolbar button.on{background:var(--border);border-radius:12px}
#sheet,#dlg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);align-items:flex-end;justify-content:center;z-index:10}
#sheet.open,#dlg.open{display:flex}
.sheet{width:100%;max-width:640px;background:var(--bg);color:var(--text);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet textarea{height:38vh;margin-bottom:12px}
.toolbar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:0 6px}
.toolbar button{padding:14px 8px;font-size:17px;font-weight:700}
.toolbar #modeBtn{font-size:14px}
.toolbar span{font-size:14px;font-weight:600;color:var(--sub)}
/* 집중 읽기: 평소엔 본문만 보이고, 화면 가운데를 누르면 메뉴가 나타나요 */
#reader{position:relative}
.rhead{position:absolute;top:0;left:0;right:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--border);opacity:0;transform:translateY(-110%);transition:.2s;pointer-events:none}
.toolbar{position:absolute;left:16px;right:16px;bottom:10px;z-index:5;opacity:0;transform:translateY(160%);transition:.2s;pointer-events:none}
#reader.ui .rhead,#reader.ui .toolbar{opacity:1;transform:none;pointer-events:auto}
#thin{position:absolute;left:0;right:0;bottom:0;height:2px;z-index:4}
#thin i{display:block;height:100%;width:0;background:var(--sub);opacity:.6}
/* 페이지 넘김 모드: 본문을 가로 단(page)으로 나눠 한 장씩 보여줘요 */
.scroll.page{overflow:hidden;padding:0}
.scroll.page #wrap{height:100%;padding:28px 24px 40px;column-count:1;column-gap:48px;column-fill:auto}
</style>
</head>
<body>

<!-- 홈 화면 -->
<section id="home" class="view active">
  <header><h1>내 서재</h1><button class="round" id="addBtn" aria-label="책 추가">+</button></header>
  <div class="bar2"><span id="sync"></span><select id="sort" aria-label="정렬"><option value="manual">직접 정렬</option><option value="recent">최근 읽은 순</option><option value="title">제목 순</option><option value="progress">진행률 순</option></select></div>
  <div class="bar2" style="padding-bottom:6px"><b id="cnt" style="color:var(--text);font-size:15px"></b><span class="vt"><button id="vCover" aria-label="큰 표지로 보기">▣</button><button id="vList" aria-label="목록으로 보기">☰</button></span></div>
  <div class="list" id="list"></div>
</section>

<!-- 내 책장 (시리즈 묶음) -->
<section id="shelves" class="view">
  <header><h1>내 책장</h1><button class="round" id="newShelf" aria-label="책장 만들기">+</button></header>
  <div class="list" id="shelfList"></div>
</section>
<section id="shelf" class="view">
  <header><button class="back" id="shBack">‹ 책장</button><b id="shName"></b><span style="width:48px"></span></header>
  <div class="list" id="shBooks" style="padding-bottom:12px"></div>
  <div class="shbtns">
    <div class="row"><button class="btn main" id="shAdd">책 추가</button><button class="btn sub" id="shSort">제목순 정렬</button></div>
    <div class="row"><button class="btn sub" id="shRename">이름 변경</button><button class="btn sub" id="shDel">책장 삭제</button></div>
  </div>
</section>
<section id="pick" class="view">
  <header><button class="back" id="pkBack">‹ 취소</button><b>책 선택</b><button class="back" id="pkDone">완료</button></header>
  <div class="list" id="pkList"></div>
</section>

<!-- 책 추가 화면 -->
<section id="add" class="view">
  <header><button class="back" id="addBack">‹ 뒤로</button><b>책 추가</b><span style="width:48px"></span></header>
  <div class="form">
    <label class="btn main" for="file" style="display:block;text-align:center;cursor:pointer">EPUB 파일 선택</label>
    <input type="file" id="file" accept=".epub,application/epub+zip" hidden>
    <p class="status" id="status"></p>
    <button class="btn sub" id="sample">샘플 책 추가 (테스트용)</button>
  </div>
</section>

<!-- 책 편집 화면 -->
<section id="edit" class="view">
  <header><button class="back" id="eBack">‹ 취소</button><b>책 편집</b><span style="width:48px"></span></header>
  <div class="form">
    <div class="prev" id="ePrev"></div>
    <div class="row" style="margin-bottom:16px">
      <label class="btn sub" for="eFile" style="margin:0;text-align:center;cursor:pointer">표지 사진 변경</label>
      <button class="btn sub" id="eClear" style="margin:0">표지 제거</button>
    </div>
    <input type="file" id="eFile" accept="image/*" hidden>
    <input id="eTitle" placeholder="제목">
    <div class="row" style="margin-bottom:12px"><button class="btn sub" id="eT1" style="margin:0;font-size:13px">첫 줄을 제목으로</button><button class="btn sub" id="eT2" style="margin:0;font-size:13px">첫 두 줄을 제목으로</button></div>
    <input id="eAuthor" placeholder="저자">
    <div class="row" style="margin-bottom:8px">
      <button class="btn sub" id="eEpub" style="margin:0">EPUB로 내보내기</button>
      <button class="btn sub" id="eTxt" style="margin:0">TXT로 내보내기</button>
    </div>
    <p class="status" id="eStatus"></p>
    <button class="btn main" id="eSave">저장</button>
  </div>
</section>

<!-- 읽기 화면 -->
<section id="reader" class="view">
  <header class="rhead"><button class="back" id="rBack">‹ 서재</button><button class="back" id="fs" hidden>⛶ 전체화면</button></header>
  <div class="scroll" id="scroll"><div id="wrap"><h2 id="bTitle"></h2><div id="body"></div></div></div>
  <div id="thin"><i></i></div>
  <div class="toolbar">
    <button id="fMinus">가-</button><button id="fPlus">가+</button>
    <button id="modeBtn" aria-label="읽기 방식"></button><button id="editMode" aria-label="본문 편집">✎</button><span id="percent">0%</span><button id="theme">☾</button>
  </div>
</section>

<nav id="tabs"><button data-tab="home" class="on">📚 내 서재</button><button data-tab="shelves">🗂 내 책장</button></nav>
<div id="dlg"><div class="sheet">
  <p id="dTitle" style="font-weight:700;margin:0 0 12px;line-height:1.5"></p><input id="dInput">
  <div class="row"><button class="btn sub" id="dNo" style="margin:0">취소</button><button class="btn main" id="dYes" style="margin:0">확인</button></div>
</div></div>

<!-- 문단 편집 시트 -->
<div id="sheet"><div class="sheet">
  <textarea id="sText"></textarea>
  <div class="row"><button class="btn sub" id="sDel" style="margin:0">삭제</button>
  <button class="btn sub" id="sCancel" style="margin:0">취소</button>
  <button class="btn main" id="sSave" style="margin:0">저장</button></div>
</div></div>

<script src="jszip.min.js"></script>
<script>
// ---------- 저장소 (localStorage, 실패해도 앱이 죽지 않게 try/catch) ----------
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d }catch(e){ return d } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true }catch(e){ return false } }
};
let books = [];   // 시작할 때 loadLocal()이 기기 저장소(IndexedDB)에서 채워 넣어요
let fontSize = store.get('mybook:font', 18);
let theme = store.get('mybook:theme', null);
const COLORS = ['#3B5BDB','#C2255C','#2F9E44','#E8590C','#7048E8','#0C8599'];
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- 화면 전환 ----------
function show(id){
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === id));
  const main = id === 'home' || id === 'shelves'; // 탭은 서재/책장 화면에서만 보여요
  $('tabs').classList.toggle('on', main);
  $('tabs').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.tab === id));
}

// ---------- 테마 ----------
const isDark = () => theme ? theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
function applyTheme(){
  if(theme) document.documentElement.dataset.theme = theme;
  $('theme').textContent = isDark() ? '☀︎' : '☾';
}
$('theme').onclick = () => { theme = isDark() ? 'light' : 'dark'; store.set('mybook:theme', theme); applyTheme(); };

// ---------- 홈: 책 카드 목록 ----------
let viewMode = store.get('mybook:view', 'cover'); // 'cover'(큰 표지) | 'list'(목록)
let focusId = null; // 방금 만진 책: 화면을 다시 그린 뒤에도 그 책이 보이게
function renderHome(){
  const L = $('list'), big = viewMode === 'cover' && books.length > 0;
  L.className = big ? 'carousel' : 'list';
  $('cnt').textContent = `책 ${books.length}권`;
  $('vCover').classList.toggle('on', viewMode === 'cover'); $('vList').classList.toggle('on', viewMode === 'list');
  L.innerHTML = !books.length ? '<div class="empty">아직 책이 없어요.<br>오른쪽 위 + 버튼으로 추가해 보세요.</div>' : view().map((b, i, arr) => {
    const p = Math.round((b.progress || 0) * 100), manual = sortMode === 'manual';
    const vis = (up) => `style="visibility:${(up ? i > 0 : i < arr.length - 1) ? 'visible' : 'hidden'}"`;
    const bg = `background-color:${b.color};${b.cover ? `background-image:url(${b.cover})` : ''}`;
    if (big) return `<div class="slide" data-id="${b.id}" role="button" tabindex="0">
      <div class="bigcover" style="${bg}">${b.cover ? '' : esc(b.title)}</div>
      <div class="srow"><div class="stitle">${esc(b.title)}</div><button class="edit2" aria-label="편집">⋮</button></div>
      <div class="a">${esc(b.author)}</div>
      <div class="sprog"><div class="bar"><i style="width:${p}%"></i></div><span>${p}%</span></div>
      ${manual ? `<div class="mvrow"><button class="up" ${vis(true)} aria-label="앞으로">◀</button><span>순서 이동</span><button class="dn" ${vis(false)} aria-label="뒤로">▶</button></div>` : ''}</div>`;
    const mv = manual ? `<div class="mv"><button class="up" ${vis(true)} aria-label="위로">▲</button><button class="dn" ${vis(false)} aria-label="아래로">▼</button></div>` : '';
    return `<div class="card" data-id="${b.id}" role="button" tabindex="0"><button class="edit" aria-label="편집">✎</button>
      <div class="cover" style="${bg}">${b.cover ? '' : esc(b.title.charAt(0))}</div>
      <div class="info"><div class="t">${esc(b.title)}</div><div class="a">${esc(b.author)}</div>
      <div class="bar"><i style="width:${p}%"></i></div><div class="pct">${p}% 읽음</div></div>${mv}</div>`;
  }).join('');
  if (big && focusId) { const el = L.querySelector(`[data-id="${focusId}"]`); // 보던 책을 가운데로
    if (el) L.scrollLeft = el.offsetLeft - (L.clientWidth - el.offsetWidth) / 2; }
}
$('list').onclick = e => { const c = e.target.closest('.card,.slide'); if (!c) return;
  const id = c.dataset.id; focusId = id;
  if (e.target.closest('.edit,.edit2')) openEdit(id);
  else if (e.target.closest('.up')) move(id, -1);
  else if (e.target.closest('.dn')) move(id, 1);
  else openBook(id); };
$('vCover').onclick = () => { viewMode = 'cover'; store.set('mybook:view', viewMode); renderHome(); };
$('vList').onclick = () => { viewMode = 'list'; store.set('mybook:view', viewMode); renderHome(); };
$('addBtn').onclick = () => { setStatus(''); show('add'); };

// ---------- 서재 정렬 ----------
let sortMode = store.get('mybook:sort', 'manual'); // manual(직접) | recent | title | progress
function view() { // 화면에 보여줄 순서 (직접 정렬이면 저장된 순서 그대로)
  const a = [...books];
  if (sortMode === 'title') a.sort(natural); // 숫자는 크기순 (1, 2, ... 9, 10)
  else if (sortMode === 'recent') a.sort((x, y) => (y.lastRead || 0) - (x.lastRead || 0));
  else if (sortMode === 'progress') a.sort((x, y) => (y.progress || 0) - (x.progress || 0));
  return a;
}
const renumber = () => books.forEach((b, i) => b.order = i);
function move(id, d) { // 책을 위/아래로 한 칸 이동
  const i = books.findIndex(b => b.id === id), j = i + d;
  if (i < 0 || j < 0 || j >= books.length) return;
  renumber(); [books[i], books[j]] = [books[j], books[i]]; renumber();
  books.forEach(saveMeta); cloudSave(books[i], false); cloudSave(books[j], false);
  renderHome();
}
$('sort').onchange = e => { sortMode = e.target.value; store.set('mybook:sort', sortMode); renderHome(); };

// ---------- 책 추가 ----------
const setStatus = t => $('status').textContent = t;
$('addBack').onclick = () => { setStatus(''); show('home'); };

// 책 한 권을 저장 (저장 공간이 모자라면 실패 안내)
async function addBook({ title, author, content, cover }) {
  const book = { id: String(Date.now()), title, author: author || '작자 미상', content, cover: cover || '',
                 progress: 0, color: COLORS[books.length % COLORS.length] };
  books.unshift(book); renumber(); setStatus('저장 중…');
  if (!(await saveBook(book)) && !cloud) { // 기기 저장소가 가득 찬 경우
    books.shift(); renumber(); setStatus('저장 공간이 부족해요. 기기의 저장 공간을 확인해 주세요.'); return;
  }
  await Promise.all(books.slice(1).map(saveMeta)); // 순서 번호 갱신
  cloudSave(book, true); setStatus(''); renderHome(); show('home');
}

// ---- EPUB 읽기: EPUB은 zip 파일이라 압축을 풀어 본문 텍스트만 뽑아냅니다 ----
async function parseEpub(file) {
  const zip = await JSZip.loadAsync(file);
  const readText = p => { const f = zip.file(p); if (!f) throw new Error(p + ' 없음'); return f.async('string'); };
  const xml = t => new DOMParser().parseFromString(t, 'application/xml');
  const tagsOf = (d, n) => [...d.getElementsByTagNameNS('*', n)];

  // 1) container.xml → OPF(책 정보) 파일 위치
  const opfPath = xml(await readText('META-INF/container.xml')).getElementsByTagNameNS('*', 'rootfile')[0].getAttribute('full-path');
  const opf = xml(await readText(opfPath));
  const dir = opfPath.includes('/') ? opfPath.slice(0, opfPath.lastIndexOf('/') + 1) : '';
  const resolve = href => { // 상대 경로 → zip 안의 실제 경로
    const out = [];
    (dir + decodeURIComponent(href.split('#')[0])).split('/').forEach(p => { if (p === '..') out.pop(); else if (p && p !== '.') out.push(p); });
    return out.join('/');
  };
  const meta = n => (tagsOf(opf, n)[0]?.textContent || '').trim();

  // 2) manifest(파일 목록)와 spine(읽는 순서)
  const items = {}; tagsOf(opf, 'item').forEach(i => items[i.getAttribute('id')] = i);
  const spine = tagsOf(opf, 'itemref').map(r => items[r.getAttribute('idref')]).filter(Boolean);

  // 3) 챕터마다 문단/제목 텍스트 추출
  const parts = [];
  for (let i = 0; i < spine.length; i++) {
    setStatus(`책을 읽는 중… ${i + 1}/${spine.length}`);
    const it = spine[i];
    if (!/html|xml/.test(it.getAttribute('media-type') || '')) continue;
    const f = zip.file(resolve(it.getAttribute('href'))); if (!f) continue;
    const doc = new DOMParser().parseFromString(await f.async('string'), 'text/html');
    doc.querySelectorAll('h1,h2,h3,h4,h5,h6,p,li,pre').forEach(el => {
      if (el.tagName === 'LI' && el.querySelector('p')) return; // 중복 방지
      const t = el.textContent.replace(/\s+/g, ' ').trim();
      if (t) parts.push(/^H/.test(el.tagName) ? '\n' + t : t);
    });
  }
  if (!parts.length) throw new Error('본문을 찾지 못했어요');

  // 4) 표지 이미지 (작게 줄여서 저장)
  let cover = '';
  try {
    let c = Object.values(items).find(i => (i.getAttribute('properties') || '').includes('cover-image'));
    if (!c) { const m = tagsOf(opf, 'meta').find(m => m.getAttribute('name') === 'cover'); c = m && items[m.getAttribute('content')]; }
    const blob = await zip.file(resolve(c.getAttribute('href'))).async('blob');
    cover = await makeCover(new Blob([blob], { type: c.getAttribute('media-type') }));
  } catch (e) { /* 표지가 없으면 색상 표지 사용 */ }

  return { title: meta('title') || file.name.replace(/\.epub$/i, ''), author: meta('creator'), content: parts.join('\n\n'), cover };
}

// 사진을 표지 크기(160x230)로 잘라 줄여서 저장 용량을 아낌
const COVW = 240, COVH = 344; // 표지 크기
// 검은 화면 판별: 샘플 픽셀이 전부 거의 검정이면 변환 실패로 봐요
const isBlack = c => { const d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data;
  for (let i = 0; i < d.length; i += 40) if (d[i] + d[i + 1] + d[i + 2] > 30) return false; return true; };
const whiteCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); return c; }; // 투명한 부분이 검게 변하지 않도록 흰 배경
const loadImg = url => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('img')); i.src = url; });
// 큰 사진을 단계적으로 줄인 뒤 표지 비율로 가운데를 잘라요 (한 번에 확 줄이면 iOS에서 검게 나올 수 있음)
function shrink(src, sw, sh) {
  const m = Math.max(sw, sh);
  if (m > 2400) { const k = 2400 / m, c = whiteCanvas(Math.round(sw * k), Math.round(sh * k));
    c.getContext('2d').drawImage(src, 0, 0, c.width, c.height); src = c; sw = c.width; sh = c.height; }
  while (sw / 2 >= COVW * 1.5 && sh / 2 >= COVH * 1.5) {
    const c = whiteCanvas(Math.floor(sw / 2), Math.floor(sh / 2));
    c.getContext('2d').drawImage(src, 0, 0, c.width, c.height); src = c; sw = c.width; sh = c.height;
  }
  const out = whiteCanvas(COVW, COVH), k = Math.max(COVW / sw, COVH / sh);
  out.getContext('2d').drawImage(src, (COVW - sw * k) / 2, (COVH - sh * k) / 2, sw * k, sh * k);
  return out;
}
async function makeCover(blob) {
  const url = URL.createObjectURL(blob);
  const tries = [ // 안 되면 다음 방법으로 차례로 시도
    async () => { const i = await loadImg(url); return shrink(i, i.naturalWidth, i.naturalHeight); },
    async () => { const b = await createImageBitmap(blob); return shrink(b, b.width, b.height); },
    async () => { const b = await createImageBitmap(blob, { resizeWidth: 1200, resizeQuality: 'high' }); return shrink(b, b.width, b.height); },
  ];
  let first = null;
  try {
    for (const t of tries) {
      try { const c = await t(); first = first || c; if (!isBlack(c)) return c.toDataURL('image/jpeg', 0.8); } catch (e) {}
    }
  } finally { URL.revokeObjectURL(url); }
  if (first) return first.toDataURL('image/jpeg', 0.8); // 정말 검은 사진이면 그대로
  throw new Error('이미지를 읽을 수 없어요');
}

// ---------- 계정 저장 (db): 브라우저 저장소가 지워져도 책이 남도록 ----------
// 한 문서는 256KiB 제한이라 본문을 6만 자씩 쪼개 저장해요.
let cloud = null, q = Promise.resolve();
const CH = 60000, chunkCache = {};
// ---------- 기기 저장소 (IndexedDB): localStorage(약 5MB)보다 훨씬 많이 저장돼요 ----------
// 책 정보(meta, 작음)와 본문(content, 큼)을 따로 저장해서 읽은 위치 저장이 가볍도록 했어요.
let idb = null;
const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const put = (name, key, val) => new Promise((res, rej) => {
  const t = idb.transaction(name, 'readwrite'); t.objectStore(name).put(val, key);
  t.oncomplete = () => res(true); t.onerror = t.onabort = () => rej(t.error);
});
const safe = pr => pr.then(() => true, () => false); // 실패(저장 공간 부족 등)하면 false
const metaOf = b => ({ id: b.id, title: b.title, author: b.author, cover: b.cover || '', color: b.color,
                       order: b.order ?? 0, progress: b.progress || 0, lastRead: b.lastRead || 0 });
const saveMeta = b => idb ? safe(put('meta', b.id, metaOf(b))) : Promise.resolve(store.set('mybook:books', books));
const saveContent = b => idb ? safe(put('content', b.id, b.content)) : Promise.resolve(store.set('mybook:books', books));
const saveBook = async b => idb ? (await saveContent(b)) && (await saveMeta(b)) : store.set('mybook:books', books);
async function loadLocal() {
  try {
    idb = await new Promise((res, rej) => { const r = indexedDB.open('mybook', 1);
      r.onupgradeneeded = () => { r.result.createObjectStore('meta'); r.result.createObjectStore('content'); };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    const t = idb.transaction(['meta', 'content']);
    const [metas, keys, vals] = await Promise.all([req(t.objectStore('meta').getAll()),
      req(t.objectStore('content').getAllKeys()), req(t.objectStore('content').getAll())]);
    const text = new Map(keys.map((k, i) => [k, vals[i]]));
    books = metas.map(m => ({ ...m, content: text.get(m.id) || '' }));
    // 이전 버전(localStorage)에 저장된 책이 있으면 새 저장소로 옮겨요
    const old = store.get('mybook:books', null);
    if (old && old.length) {
      let all = true;
      for (const [i, b] of old.entries()) if (!books.some(x => x.id === b.id)) { b.order = i; books.push(b); all = (await saveBook(b)) && all; }
      if (all) try { localStorage.removeItem('mybook:books'); } catch (e) {}
    }
  } catch (e) { idb = null; books = store.get('mybook:books', []); } // IndexedDB를 못 쓰면 예전 방식 사용
  books.sort((a, b) => (a.order ?? 1e9) - (b.order ?? 1e9) || b.id - a.id);
}
const setSync = t => $('sync').textContent = t;
const chunksOf = c => { const a = []; for (let i = 0; i < c.length; i += CH) a.push(c.slice(i, i + CH)); return a.length ? a : ['']; };
const cloudSave = (b, withContent) => (q = q.then(() => cloudSaveNow(b, withContent)));
async function cloudSaveNow(b, withContent) {
  if (!cloud) return;
  try {
    const chunks = chunksOf(b.content), old = chunkCache[b.id] || [];
    if (withContent || !chunkCache[b.id]) {
      setSync('☁︎ 저장 중…');
      for (let i = 0; i < chunks.length; i++) // 바뀐 조각만 기록
        if (chunks[i] !== old[i]) await cloud.doc('c_' + b.id + '_' + i).set({ kind: 'chunk', bookId: b.id, i, text: chunks[i] });
      for (let i = chunks.length; i < old.length; i++) await cloud.doc('c_' + b.id + '_' + i).delete();
      chunkCache[b.id] = chunks;
    }
    await cloud.doc('b_' + b.id).set({ kind: 'book', id: b.id, title: b.title, author: b.author, cover: b.cover || '',
      progress: b.progress || 0, color: b.color, n: chunks.length, order: b.order ?? 0, lastRead: b.lastRead || 0 });
    setSync('☁︎ 계정에 저장됨');
  } catch (e) { setSync('⚠︎ 계정 저장 실패 (이 브라우저에는 저장됨)'); }
}
async function initCloud() {
  try {
    const db = await window.claude?.use('db'), user = await window.claude?.use('user');
    const uid = user && await user.id();
    if (!db || !uid) { setSync('이 기기에만 저장 중 · 내보내기로 백업하세요'); return; }
    cloud = db.collection('data/users/' + uid);
    const metas = {}, chunks = {}, shelfDocs = {}, restored = [];
    (await cloud.get()).docs.forEach(d => { const x = d.data();
      if (x.kind === 'book') metas[x.id] = x; else if (x.kind === 'shelf') shelfDocs[x.id] = x; else if (x.kind === 'chunk') (chunks[x.bookId] = chunks[x.bookId] || [])[x.i] = x.text; });
    Object.values(metas).forEach(m => { // 계정 → 이 기기로 복원
      const parts = chunks[m.id] || [];
      if (parts.length < m.n || parts.some(p => p == null) || (cur && cur.id === m.id)) return;
      chunkCache[m.id] = parts;
      const book = { id: m.id, title: m.title, author: m.author, cover: m.cover, progress: m.progress, color: m.color, order: m.order, lastRead: m.lastRead, content: parts.join('') };
      const i = books.findIndex(b => b.id === m.id), same = i >= 0 && books[i].content === book.content;
      if (i >= 0) books[i] = book; else books.push(book); restored.push([book, !same]);
    });
    books.sort((a, b) => (a.order ?? 1e9) - (b.order ?? 1e9) || b.id - a.id); renderHome();
    for (const [b, full] of restored) await (full ? saveBook(b) : saveMeta(b));
    Object.values(shelfDocs).forEach(x => { // 계정의 책장을 이 기기로
      const sh = { id: x.id, name: x.name, bookIds: x.bookIds || [], order: x.order || 0 }, i = shelves.findIndex(y => y.id === x.id);
      if (i >= 0) shelves[i] = sh; else shelves.push(sh);
    });
    shelves.sort((a, b) => (a.order ?? 0) - (b.order ?? 0)); store.set('mybook:shelves', shelves); renderShelves();
    for (const sh of shelves) if (!shelfDocs[sh.id]) cloudShelf(sh); // 이 기기에만 있던 책장은 계정으로
    for (const b of books) if (!metas[b.id]) await cloudSave(b, true); // 이 기기에만 있던 책은 계정으로 올리기
    setSync('☁︎ 계정에 저장됨');
  } catch (e) { setSync('이 기기에만 저장 중 · 내보내기로 백업하세요'); }
}

// ---------- 내보내기: 수정된 사본을 EPUB / TXT 파일로 저장 ----------
async function saveFile(filename, data) {
  const dl = await window.claude?.use('downloads');
  if (!dl) {
    const blob = data instanceof Blob ? data : new Blob([data], { type: 'text/plain;charset=utf-8' });
    const file = new File([blob], filename, { type: blob.type || 'application/octet-stream' });
    try {
      if (navigator.canShare?.({ files: [file] })) { await navigator.share({ files: [file] }); $('eStatus').textContent = '내보냈어요.'; return; }
    } catch (e) { if (e.name === 'AbortError') return; }
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000); $('eStatus').textContent = '내보냈어요.'; return;
  }
  try { await dl.save({ filename, data }); $('eStatus').textContent = '내보냈어요.'; }
  catch (e) { $('eStatus').textContent = e.code === 'declined' ? '' : '내보내기에 실패했어요.'; }
}
const fname = b => b.title.replace(/[\\/:*?"<>|]/g, '_');
$('eTxt').onclick = () => { const b = editing();
  saveFile(fname(b) + '.txt', b.title + '\n' + b.author + '\n\n' + b.content.replace(/\n{3,}/g, '\n\n').trim()); };
$('eEpub').onclick = async () => {
  const b = editing(), x = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const z = new JSZip(), NS = 'xmlns="http://www.w3.org/1999/xhtml"';
  z.file('mimetype', 'application/epub+zip', { compression: 'STORE' });
  z.file('META-INF/container.xml', '<?xml version="1.0"?><container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container"><rootfiles><rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/></rootfiles></container>');
  const body = b.content.split('\n\n').filter(t => t.trim()).map(t => { // 앞에 줄바꿈이 있던 문단 = 제목
    const h = t.startsWith('\n'), v = x(t.trim()).replace(/\n/g, '<br/>'); return h ? `<h2>${v}</h2>` : `<p>${v}</p>`; }).join('\n');
  z.file('OEBPS/book.xhtml', `<?xml version="1.0" encoding="UTF-8"?><html ${NS} xml:lang="ko"><head><title>${x(b.title)}</title></head><body><h1>${x(b.title)}</h1>\n${body}</body></html>`);
  z.file('OEBPS/nav.xhtml', `<?xml version="1.0" encoding="UTF-8"?><html ${NS} xmlns:epub="http://www.idpf.org/2007/ops"><head><title>목차</title></head><body><nav epub:type="toc"><ol><li><a href="book.xhtml">${x(b.title)}</a></li></ol></nav></body></html>`);
  if (b.cover) z.file('OEBPS/cover.jpg', b.cover.split(',')[1], { base64: true });
  z.file('OEBPS/content.opf', `<?xml version="1.0" encoding="UTF-8"?><package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="id"><metadata xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:identifier id="id">mybook-${b.id}</dc:identifier><dc:title>${x(b.title)}</dc:title><dc:creator>${x(b.author)}</dc:creator><dc:language>ko</dc:language><meta property="dcterms:modified">${new Date().toISOString().replace(/\.\d+Z/, 'Z')}</meta>${b.cover ? '<meta name="cover" content="cover"/>' : ''}</metadata><manifest><item id="nav" href="nav.xhtml" media-type="application/xhtml+xml" properties="nav"/><item id="book" href="book.xhtml" media-type="application/xhtml+xml"/>${b.cover ? '<item id="cover" href="cover.jpg" media-type="image/jpeg" properties="cover-image"/>' : ''}</manifest><spine><itemref idref="book"/></spine></package>`);
  saveFile(fname(b) + '.epub', await z.generateAsync({ type: 'blob', mimeType: 'application/epub+zip' }));
};

// ---------- 내 책장: 시리즈 책을 묶어서 분류 ----------
let shelves = store.get('mybook:shelves', []);   // [{id, name, bookIds:[책 id 순서대로]}]
let curShelf = null, pickSet = new Set();
const shelfById = id => shelves.find(x => x.id === id);
const bookById = id => books.find(b => b.id === id);
const saveShelves = () => store.set('mybook:shelves', shelves);
const cloudShelf = sh => (q = q.then(async () => { if (!cloud) return;
  try { await cloud.doc('s_' + sh.id).set({ kind: 'shelf', id: sh.id, name: sh.name, bookIds: sh.bookIds, order: sh.order ?? 0 }); } catch (e) {} }));
const cloudShelfDel = id => (q = q.then(async () => { if (!cloud) return; try { await cloud.doc('s_' + id).delete(); } catch (e) {} }));
const touch = sh => { saveShelves(); cloudShelf(sh); renderShelf(); };
const coverStyle = b => `background-color:${b.color};${b.cover ? `background-image:url(${b.cover})` : ''}`;
const natural = (a, b) => a.title.localeCompare(b.title, 'ko', { numeric: true }); // 1권, 2권, 10권 순서로

// 입력/확인 창 (브라우저 기본 prompt 대신 앱 안에서 띄움)
function dialog(title, { input = false, value = '', ok = '확인' } = {}) {
  return new Promise(res => {
    const inp = $('dInput');
    $('dTitle').textContent = title; inp.style.display = input ? '' : 'none'; inp.value = value; $('dYes').textContent = ok;
    $('dlg').classList.add('open'); if (input) inp.focus();
    const done = v => { $('dlg').classList.remove('open'); $('dYes').onclick = $('dNo').onclick = null; res(v); };
    $('dYes').onclick = () => done(input ? inp.value.trim() : true);
    $('dNo').onclick = () => done(null);
  });
}

// 책장 목록 (표지 미리보기 + 권수)
function renderShelves() {
  $('shelfList').innerHTML = shelves.length ? shelves.map(sh => {
    const bs = sh.bookIds.map(bookById).filter(Boolean);
    const minis = bs.slice(0, 4).map(b => `<span class="mini" style="${coverStyle(b)}">${b.cover ? '' : esc(b.title.charAt(0))}</span>`).join('') || '<span class="mini none"></span>';
    return `<div class="card shelfcard" data-id="${sh.id}" role="button" tabindex="0"><div class="minis">${minis}</div>
      <div class="info"><div class="t">${esc(sh.name)}</div><div class="a">${bs.length}권</div></div></div>`;
  }).join('') : '<div class="empty">아직 책장이 없어요.<br>오른쪽 위 + 버튼으로 시리즈 책장을 만들어 보세요.</div>';
}
$('shelfList').onclick = e => { const c = e.target.closest('.shelfcard'); if (c) { curShelf = c.dataset.id; renderShelf(); show('shelf'); } };
$('newShelf').onclick = async () => {
  const name = await dialog('새 책장 이름', { input: true }); if (!name) return;
  const sh = { id: String(Date.now()), name, bookIds: [], order: shelves.length };
  shelves.push(sh); saveShelves(); cloudShelf(sh); curShelf = sh.id; renderShelf(); show('shelf');
};

// 책장 안: 시리즈 순서대로 책 표시 (▲▼ 이동, ✕ 빼기)
function renderShelf() {
  const sh = shelfById(curShelf); if (!sh) return;
  $('shName').textContent = sh.name;
  const bs = sh.bookIds.map(bookById).filter(Boolean);
  $('shBooks').innerHTML = bs.length ? bs.map((b, i) => {
    const p = Math.round((b.progress || 0) * 100);
    return `<div class="card" data-id="${b.id}" role="button" tabindex="0">
      <div class="cover" style="${coverStyle(b)}">${b.cover ? '' : esc(b.title.charAt(0))}</div>
      <div class="info"><div class="t">${esc(b.title)}</div><div class="a">${i + 1}번째 · ${esc(b.author)}</div>
      <div class="bar"><i style="width:${p}%"></i></div><div class="pct">${p}% 읽음</div></div>
      <div class="mv"><button class="up" style="visibility:${i ? 'visible' : 'hidden'}" aria-label="위로">▲</button><button class="dn" style="visibility:${i < bs.length - 1 ? 'visible' : 'hidden'}" aria-label="아래로">▼</button><button class="rm" aria-label="책장에서 빼기">✕</button></div></div>`;
  }).join('') : '<div class="empty">이 책장은 비어 있어요.<br>아래 "책 추가"로 책을 담아 보세요.</div>';
}
$('shBooks').onclick = e => {
  const c = e.target.closest('.card'), sh = shelfById(curShelf); if (!c || !sh) return;
  const id = c.dataset.id, i = sh.bookIds.indexOf(id), up = e.target.closest('.up'), dn = e.target.closest('.dn');
  if (up || dn) { const j = i + (up ? -1 : 1); if (j < 0 || j >= sh.bookIds.length) return;
    [sh.bookIds[i], sh.bookIds[j]] = [sh.bookIds[j], sh.bookIds[i]]; touch(sh); }
  else if (e.target.closest('.rm')) { sh.bookIds.splice(i, 1); touch(sh); }  // 서재에서 지우는 게 아니라 책장에서만 뺌
  else openBook(id, 'shelf');
};
$('shBack').onclick = () => { renderShelves(); show('shelves'); };
$('shSort').onclick = () => { const sh = shelfById(curShelf);
  sh.bookIds = sh.bookIds.map(bookById).filter(Boolean).sort(natural).map(b => b.id); touch(sh); };
$('shRename').onclick = async () => { const sh = shelfById(curShelf);
  const name = await dialog('책장 이름', { input: true, value: sh.name }); if (name) { sh.name = name; touch(sh); } };
$('shDel').onclick = async () => { const sh = shelfById(curShelf);
  if (!await dialog(`"${sh.name}" 책장을 삭제할까요?\n(책은 서재에 그대로 남아요)`, { ok: '삭제' })) return;
  shelves = shelves.filter(x => x.id !== sh.id); saveShelves(); cloudShelfDel(sh.id); renderShelves(); show('shelves'); };

// 책 고르기: 서재의 책을 체크해서 책장에 담기
$('shAdd').onclick = () => {
  pickSet = new Set(shelfById(curShelf).bookIds);
  $('pkList').innerHTML = books.length ? books.map(b => `<label class="card pk"><div class="cover" style="${coverStyle(b)}">${b.cover ? '' : esc(b.title.charAt(0))}</div>
    <div class="info"><div class="t">${esc(b.title)}</div><div class="a">${esc(b.author)}</div></div>
    <input type="checkbox" data-id="${b.id}" ${pickSet.has(b.id) ? 'checked' : ''}></label>`).join('')
    : '<div class="empty">서재에 책이 없어요.</div>';
  show('pick');
};
$('pkList').onchange = e => { const i = e.target; if (i.dataset.id) i.checked ? pickSet.add(i.dataset.id) : pickSet.delete(i.dataset.id); };
$('pkBack').onclick = () => show('shelf');
$('pkDone').onclick = () => {
  const sh = shelfById(curShelf);
  const kept = sh.bookIds.filter(id => pickSet.has(id));                       // 기존 순서 유지
  const added = [...pickSet].filter(id => !kept.includes(id)).map(bookById).filter(Boolean).sort(natural).map(b => b.id);
  sh.bookIds = [...kept, ...added]; touch(sh); show('shelf');                  // 새로 담은 책은 1권, 2권… 순으로 뒤에 붙임
};
$('tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.tab === 'shelves') renderShelves(); else renderHome(); show(b.dataset.tab); };

// ---------- 시작 ----------
// 전체화면: 지원하는 환경(PC, iPad 등)에서만 버튼이 나타나요
const de = document.documentElement;
if (document.fullscreenEnabled || document.webkitFullscreenEnabled) {
  $('fs').hidden = false;
  $('fs').onclick = () => {
    const on = document.fullscreenElement || document.webkitFullscreenElement;
    try { on ? (document.exitFullscreen || document.webkitExitFullscreen).call(document)
             : (de.requestFullscreen || de.webkitRequestFullscreen).call(de); } catch (e) {}
  };
}
applyTheme(); applyMode(); $('sort').value = sortMode; show('home'); renderShelves();
loadLocal().then(() => { renderHome(); renderShelves(); initCloud(); });
navigator.storage?.persist?.();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
